<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071f4d"><title>FSBO Opportunity Radar</title><link rel="stylesheet" href="styles.css"></head><body><div class="authGate" id="authGate"><form class="authCard" id="authForm"><h1>FSBO Opportunity Radar</h1><p>Sign in to your live cloud CRM. Statuses, notes, and activity history are shared across browsers.</p><div class="authField"><label for="authUser">Username</label><input id="authUser" autocomplete="username" required></div><div class="authField"><label for="authPass">Password</label><input id="authPass" type="password" autocomplete="current-password" required></div><button class="authBtn" id="authBtn">Open Dashboard</button><div class="authErr" id="authErr"></div></form></div><div class="mobilebar" id="mobileNav"></div><div class="app"><aside class="side"><div class="brand">FSBO Opportunity Radar<small>Investor • DSCR • Refinance CRM</small></div><div class="nav" id="sideNav"></div><div class="sidefoot">Live cloud CRM<br>Status, notes, and change history persist across browsers.</div></aside><main class="main"><section id="dashboard" class="page active"></section><section id="leads" class="page"></section><section id="multi" class="page"></section><section id="rental" class="page"></section><section id="ny" class="page"></section><section id="activity" class="page"></section><section id="history" class="page"></section></main></div><dialog class="modal" id="leadModal"><div class="modalHead"><div><div class="addr" id="mAddr"></div><div class="tiny" id="mLoc"></div></div><button class="btn" id="mClose" type="button">Close</button></div><div class="modalBody"><div class="detailGrid" id="mMetrics"></div><div id="mReason"></div><div class="field"><label for="mStatus">Disposition</label><select id="mStatus"><option value="">Unassigned</option><option value="called">Called</option><option value="working">Working</option><option value="converted">Converted</option><option value="dead">Dead</option></select></div><div class="field"><label for="mNotes">Notes</label><textarea id="mNotes" placeholder="Add call notes, follow-up details, borrower situation, property notes..."></textarea></div><div class="history" id="mHistory"></div></div><div class="modalFoot"><a class="zlink" id="mZillow" target="_blank" rel="noopener">Open Zillow</a><button class="btn primary" id="mSave" type="button">Save Changes</button></div></dialog><div class="toast" id="toast"></div><script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script><script src="app.js"></script><script src="exports.js"></script></body></html>
